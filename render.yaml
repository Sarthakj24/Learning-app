# Render Blueprint for WH Now Learn
# Deploy: push this repo to GitHub, then in Render: New + > Blueprint > pick the repo.
# Render reads this file and provisions the database and both services.

databases:
  - name: whnow-learn-db
    plan: basic-256mb          # smallest paid Postgres plan (~$6/mo); avoids the one-free-db-per-account limit and free-db 90-day expiry
    databaseName: whnow_learn
    user: whnow

services:
  # ---------------- API (Node/Express + Prisma) ----------------
  - type: web
    name: whnow-learn-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    # migrate deploy applies the SQL migration (tables + RLS policies),
    # then seed runs (idempotent), then the server starts.
    startCommand: npm run start:migrate
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: whnow-learn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_SUPERADMIN_PASSWORD
        sync: false            # set this yourself in the Render dashboard
      - key: WEB_ORIGIN
        # Tighten to your web URL after first deploy; "*" reflects all origins.
        value: "*"
      - key: NODE_VERSION
        value: "20"

  # ---------------- Web (React/Vite static site) ----------------
  - type: web
    name: whnow-learn-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: whnow-learn-api
          property: host       # scheme-less host; the client prepends https://
    routes:
      - type: rewrite          # SPA fallback so client routes resolve
        source: /*
        destination: /index.html
